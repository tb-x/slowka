<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ec8ff">
<title>Słówka – gra dla dzieci</title>
<meta name="description" content="Prosta gra w zgadywanie krótkich polskich słów dla dzieci.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Słówka">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<a id="home" href="../index.html" aria-label="Wszystkie gry" title="Wszystkie gry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>

<header class="topbar">
  <button id="help-btn" class="round-btn" aria-label="Jak grać?" title="Jak grać?">?</button>
  <h1>Słówka</h1>
  <div class="score" title="Wygrane gry"><span aria-hidden="true">🏆</span><span id="wins">0</span></div>
</header>

<main>
  <div class="play">
    <p id="hint" class="hint" aria-live="polite"></p>

    <div id="board" class="board" role="grid" aria-label="Plansza gry"></div>

    <p id="message" class="message" role="status" aria-live="polite"></p>
  </div>

  <div id="keyboard" class="keyboard" aria-label="Klawiatura"></div>
</main>

<!-- Panel końca gry -->
<div id="endcard" class="overlay" hidden>
  <div class="card">
    <div id="end-emoji" class="end-emoji" aria-hidden="true">🎉</div>
    <h2 id="end-title">Brawo!</h2>
    <p id="end-text"></p>
    <button id="again-btn" class="big-btn">Gramy jeszcze raz</button>
  </div>
</div>

<!-- Panel pomocy -->
<div id="helpcard" class="overlay" hidden>
  <div class="card">
    <h2>Jak grać?</h2>
    <p class="help-note">
      Na górze jest podpowiedź, o czym jest słowo.
      Tyle jest okienek, ile liter ma słowo.
    </p>
    <ul class="help-list">
      <li><span class="mini tile-correct">K</span> Ta litera jest w słowie i stoi w dobrym miejscu.</li>
      <li><span class="mini tile-present">O</span> Ta litera jest w słowie, ale w innym miejscu.</li>
      <li><span class="mini tile-absent">T</span> Tej litery nie ma w słowie.</li>
    </ul>
    <p class="help-note">Masz 6 prób.</p>
    <button id="help-close" class="big-btn">Rozumiem!</button>
  </div>
</div>

<script src="words.js"></script>
<script src="game.js"></script>
<script>
// Gra bez internetu: sw.js zapisuje tę stronę. Po wczytaniu wysyłamy mu listę wszystkich plików, których strona
// użyła (skrypty, style), żeby też działały offline. Tam, gdzie się nie da (np. file://), po cichu nic nie robi.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
</body>
</html>
